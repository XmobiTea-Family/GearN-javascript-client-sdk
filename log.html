<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <title>GN SERVER</title>
</head>

<body>
  <div class="container">
    <h4 class="mb-5">[GN SERVER] Log Tool</h4>

    <div class="row mb-3">
      <div class="col-12 col-md-3">
        <input class="input-height form-control" style="height: 40px; width: 256px !important;" type="text"
          placeholder="Skip" id="skipField" value="0" />
      </div>
      <div class="col-12 col-md-3">
        <input class="input-height form-control" style="height: 40px; width: 256px !important;" type="text"
          placeholder="Limit" id="limitField" value="100" />
      </div>
    </div>

    <div class="mb-3">
      <button class="btn btn-success" style="width: 256px !important;" onclick="gnConnectSocket()">Refresh</button>
    </div>

    <div class="mb-3">
      <table class="table table-striped">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col" style="width:95%">Log</th>
          </tr>
        </thead>
        <tbody id="panelLog">
          <tr>
            <th scope="row">1</th>
            <td>Mark</td>
          </tr>
          <tr>
            <th scope="row">2</th>
            <td>Jacob</td>
          </tr>
          <tr>
            <th scope="row">3</th>
            <td>Larry</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <h6 style="text-align:center;">©2023 <a href="https://xmobitea.com">XmobiTea Family</a></h6>
</body>

</html>
